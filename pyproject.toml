[project]
name = "schedule-bot"
version = "0.1.0"
description = "Telegram-бот расписания МИИГАиК для группы ИБО-26-2"
readme = "README.md"
authors = [
    { name = "Nam0vicH", email = "wot12re@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "aiogram>=3.20.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0",
]

[project.scripts]
schedule-bot = "schedule_bot:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
